openapi: 3.0.3
info:
  title: Pamo API
  version: 1.0.0
  description: 'API de Pamo: accesos, feature tracking, remisiones (logistics) y facturación
    (accounting).'
paths:
  /api/accounting/remittances/:
    get:
      operationId: accounting_remittances_list
      description: Remisiones no anuladas con datos privados de preparación. Crea
        RemittanceInvoiceLine vacías para cualquier línea que aún no la tenga.
      summary: Cola de contabilidad
      tags:
      - Accounting
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Remittance'
          description: ''
  /api/accounting/remittances/{remittance_id}/invoice/confirm/:
    post:
      operationId: accounting_remittances_invoice_confirm_create
      description: 'Requiere EXTERNAL_WRITES_ENABLED y SIIGO_INVOICE_WRITES_ENABLED
        activas (503 si no). Idempotente por remisión+versión: reintentar devuelve
        el mismo resultado sin volver a llamar a Siigo. Si el intento anterior quedó
        en resultado desconocido (error de red), bloquea el reintento automático (400).'
      summary: Emitir la factura en Siigo
      parameters:
      - in: path
        name: remittance_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Accounting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvoiceConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvoiceConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceConfirmResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceConfirmResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceConfirmResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceConfirmResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceConfirmResponse'
          description: ''
  /api/accounting/remittances/{remittance_id}/invoice/preview/:
    get:
      operationId: accounting_remittances_invoice_preview_retrieve
      description: Valida que todas las líneas tengan siigo_sku/invoice_unit_price
        codificados en RemittanceInvoiceLine (vía /admin/) y devuelve el cálculo.
        No escribe nada en Siigo.
      summary: Vista previa de factura
      parameters:
      - in: path
        name: remittance_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Accounting
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePreview'
          description: ''
  /api/auth/google/:
    post:
      operationId: auth_google_create
      summary: Iniciar sesión con Google
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
            examples:
              TokenDeGoogle:
                value:
                  credential: eyJhbGciOi...
                summary: Token de Google
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLoginSuccess'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLoginBadRequest'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLoginForbidden'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Cerrar sesión
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Usuario autenticado actual
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/menu/:
    get:
      operationId: auth_menu_list
      description: Árbol de módulos/submódulos filtrado por los roles del usuario
        logueado -- ver accounts/menu_config.py.
      summary: Menú de navegación
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuArea'
          description: ''
  /api/auth/ping-admin/:
    get:
      operationId: auth_ping_admin_retrieve
      description: |-
        Endpoint de prueba para verificar el mixin de roles de punta a punta.
        Borrar (o dejar de referencia) una vez existan endpoints reales.
      summary: Ping de prueba para el mixin de roles
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingAdmin'
          description: ''
  /api/logistics/remittances/:
    get:
      operationId: logistics_remittances_list
      description: |-
        Mixin para APIView: declarar `allowed_roles = ["Admin", "Operaciones"]`
        en la vista. Sin la lista, solo exige sesión iniciada.
      summary: Listar remisiones
      parameters:
      - in: query
        name: current_state
        schema:
          type: string
        description: Filtra por Remittance.State (DRAFT, SENT_TO_CONFIRM, CONFIRMED,
          PENDING_INVOICE, INVOICING, INVOICED, INVOICE_FAILED, CANCELLED).
      tags:
      - Logistics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Remittance'
          description: ''
    post:
      operationId: logistics_remittances_create
      description: |-
        Mixin para APIView: declarar `allowed_roles = ["Admin", "Operaciones"]`
        en la vista. Sin la lista, solo exige sesión iniciada.
      summary: Crear una remisión (borrador)
      tags:
      - Logistics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Remittance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Remittance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Remittance'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remittance'
          description: ''
  /api/logistics/remittances/{remittance_id}/:
    get:
      operationId: logistics_remittances_retrieve
      description: |-
        Mixin para APIView: declarar `allowed_roles = ["Admin", "Operaciones"]`
        en la vista. Sin la lista, solo exige sesión iniciada.
      summary: Detalle de una remisión
      parameters:
      - in: path
        name: remittance_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Logistics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remittance'
          description: ''
  /api/logistics/remittances/{remittance_id}/cancel/:
    post:
      operationId: logistics_remittances_cancel_create
      description: Solo permitido desde DRAFT, SENT_TO_CONFIRM o CONFIRMED -- nunca
        después de INVOICED.
      summary: Anular (-> CANCELLED)
      parameters:
      - in: path
        name: remittance_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Logistics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReason'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelReason'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelReason'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remittance'
          description: ''
  /api/logistics/remittances/{remittance_id}/confirm/:
    post:
      operationId: logistics_remittances_confirm_create
      description: El cliente ya firmó/confirmó. Asigna el consecutivo RD-xxxx de
        forma transaccional.
      summary: Confirmar (SENT_TO_CONFIRM -> CONFIRMED -> PENDING_INVOICE)
      parameters:
      - in: path
        name: remittance_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Logistics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedVersion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpectedVersion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpectedVersion'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remittance'
          description: ''
  /api/logistics/remittances/{remittance_id}/send-to-confirm/:
    post:
      operationId: logistics_remittances_send_to_confirm_create
      description: Marca que la remisión se envió al cliente para firma/confirmación.
        Hoy es marcación manual.
      summary: Enviar a confirmar (DRAFT -> SENT_TO_CONFIRM)
      parameters:
      - in: path
        name: remittance_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Logistics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Remittance'
          description: ''
  /api/logistics/remittances/references/:
    get:
      operationId: logistics_remittances_references_retrieve
      description: |-
        Mixin para APIView: declarar `allowed_roles = ["Admin", "Operaciones"]`
        en la vista. Sin la lista, solo exige sesión iniciada.
      summary: Bodegas y favoritos activos
      tags:
      - Logistics
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemittanceReferenceData'
          description: ''
  /api/tracking/prototipos/:
    get:
      operationId: tracking_prototipos_list
      description: |-
        Mixin para APIView consumidas por un cliente interno máquina-a-máquina
        (no un usuario con sesión, no un webhook de proveedor externo) -- ver
        `GOVERNANCE.md` §4.4.
      summary: Listar prototipos
      parameters:
      - in: header
        name: X-API-Key
        schema:
          type: string
        description: Requerido para clientes máquina-a-máquina (ej. servidor MCP)
          sin sesión de Django.
      tags:
      - Feature Tracking
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GovernancePrototipo'
          description: ''
    post:
      operationId: tracking_prototipos_create
      description: |-
        Mixin para APIView consumidas por un cliente interno máquina-a-máquina
        (no un usuario con sesión, no un webhook de proveedor externo) -- ver
        `GOVERNANCE.md` §4.4.
      summary: Registrar un prototipo
      parameters:
      - in: header
        name: X-API-Key
        schema:
          type: string
        description: Requerido para clientes máquina-a-máquina (ej. servidor MCP)
          sin sesión de Django.
      tags:
      - Feature Tracking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernancePrototipo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GovernancePrototipo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GovernancePrototipo'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernancePrototipo'
          description: ''
  /api/tracking/prototipos/{id}/:
    get:
      operationId: tracking_prototipos_retrieve
      description: |-
        Mixin para APIView consumidas por un cliente interno máquina-a-máquina
        (no un usuario con sesión, no un webhook de proveedor externo) -- ver
        `GOVERNANCE.md` §4.4.
      summary: Detalle de un prototipo
      parameters:
      - in: header
        name: X-API-Key
        schema:
          type: string
        description: Requerido para clientes máquina-a-máquina (ej. servidor MCP)
          sin sesión de Django.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Feature Tracking
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernancePrototipo'
          description: ''
    patch:
      operationId: tracking_prototipos_partial_update
      description: |-
        Mixin para APIView consumidas por un cliente interno máquina-a-máquina
        (no un usuario con sesión, no un webhook de proveedor externo) -- ver
        `GOVERNANCE.md` §4.4.
      summary: Actualizar parcialmente un prototipo
      parameters:
      - in: header
        name: X-API-Key
        schema:
          type: string
        description: Requerido para clientes máquina-a-máquina (ej. servidor MCP)
          sin sesión de Django.
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Feature Tracking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGovernancePrototipo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGovernancePrototipo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGovernancePrototipo'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernancePrototipo'
          description: ''
  /api/tracking/prototipos/admin/:
    get:
      operationId: tracking_prototipos_admin_list
      description: |-
        Lectura de la lista completa -- para el frontend (usuario con rol
        Admin, sesión de Django) y para el servidor MCP (API key). La creación
        y modificación las hace el MCP a través de
        `GovernancePrototipoListCreateAPI` / `GovernancePrototipoDetailAPI`
        (API key), no este endpoint.
      summary: Listar prototipos (Admin o API key)
      parameters:
      - in: header
        name: X-API-Key
        schema:
          type: string
        description: Requerido para clientes máquina-a-máquina (ej. servidor MCP)
          sin sesión de Django.
      tags:
      - Feature Tracking
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GovernancePrototipo'
          description: ''
  /api/tracking/webhooks/github/merge/:
    post:
      operationId: tracking_webhooks_github_merge_create
      description: Actualiza los campos de merge del GovernancePrototipo correspondiente.
        Autenticado por firma HMAC (header X-Hub-Signature-256), no por sesión ni
        API key -- ver integrations/github.py.
      summary: Webhook de GitHub (pull_request)
      parameters:
      - in: header
        name: X-Hub-Signature-256
        schema:
          type: string
        description: Firma HMAC-SHA256 del body, calculada con el secreto compartido
          con GitHub.
        required: true
      tags:
      - Webhooks
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '401':
          description: No response body
components:
  schemas:
    AmbienteEnum:
      enum:
      - desarrollo
      - staging
      - produccion
      type: string
      description: |-
        * `desarrollo` - Desarrollo
        * `staging` - Staging
        * `produccion` - Producción
    CancelReason:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    CurrentStateEnum:
      enum:
      - DRAFT
      - SENT_TO_CONFIRM
      - CONFIRMED
      - PENDING_INVOICE
      - INVOICING
      - INVOICED
      - INVOICE_FAILED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - Borrador
        * `SENT_TO_CONFIRM` - Enviada a confirmar
        * `CONFIRMED` - Confirmada
        * `PENDING_INVOICE` - Factura pendiente
        * `INVOICING` - Facturando
        * `INVOICED` - Facturada
        * `INVOICE_FAILED` - Error de facturación
        * `CANCELLED` - Anulada
    DeliveryStatusEnum:
      enum:
      - PENDING
      - COMPLETED
      type: string
      description: |-
        * `PENDING` - Pendiente
        * `COMPLETED` - Completada
    EstadoEnum:
      enum:
      - activo
      - archivado
      type: string
      description: |-
        * `activo` - Activo
        * `archivado` - Archivado
    ExpectedVersion:
      type: object
      properties:
        expected_version:
          type: integer
      required:
      - expected_version
    Favorite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        party:
          allOf:
          - $ref: '#/components/schemas/Party'
          readOnly: true
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        requires_validation:
          type: boolean
      required:
      - id
      - party
    GoogleLoginBadRequest:
      type: object
      properties:
        authorized:
          type: boolean
        reason:
          $ref: '#/components/schemas/GoogleLoginBadRequestReasonEnum'
      required:
      - authorized
      - reason
    GoogleLoginBadRequestReasonEnum:
      enum:
      - missing_credential
      - invalid_token
      type: string
      description: |-
        * `missing_credential` - missing_credential
        * `invalid_token` - invalid_token
    GoogleLoginForbidden:
      type: object
      properties:
        authorized:
          type: boolean
        reason:
          $ref: '#/components/schemas/GoogleLoginForbiddenReasonEnum'
      required:
      - authorized
      - reason
    GoogleLoginForbiddenReasonEnum:
      enum:
      - email_not_verified
      - not_allowed
      type: string
      description: |-
        * `email_not_verified` - email_not_verified
        * `not_allowed` - not_allowed
    GoogleLoginRequest:
      type: object
      properties:
        credential:
          type: string
      required:
      - credential
    GoogleLoginSuccess:
      type: object
      properties:
        authorized:
          type: boolean
        user:
          $ref: '#/components/schemas/GoogleLoginUser'
      required:
      - authorized
      - user
    GoogleLoginUser:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
      required:
      - email
      - name
    GovernancePrototipo:
      type: object
      description: |-
        Los campos de merge son de solo lectura acá: solo el webhook de
        GitHub (`webhooks.py` + `functions/procesar_webhook_github_merge.py`)
        puede escribirlos -- una sola fuente de verdad para el estado de merge.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        nombre:
          type: string
          maxLength: 200
        descripcion:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        ambiente:
          $ref: '#/components/schemas/AmbienteEnum'
        url_github:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        creado_por:
          type: string
          maxLength: 200
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
        merged_to_desarrollo:
          type: boolean
          readOnly: true
        merged_to_produccion:
          type: boolean
          readOnly: true
        url_merge_request:
          type: string
          format: uri
          readOnly: true
        github_event_id:
          type: string
          readOnly: true
        ultima_actualizacion_webhook:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - actualizado_en
      - ambiente
      - creado_en
      - creado_por
      - descripcion
      - github_event_id
      - id
      - merged_to_desarrollo
      - merged_to_produccion
      - nombre
      - ultima_actualizacion_webhook
      - url_merge_request
    InvoiceConfirmRequest:
      type: object
      properties:
        document_id:
          type: integer
          description: ID del comprobante/serie electrónica en Siigo.
        seller_id:
          type: integer
          description: ID del vendedor en Siigo.
        payment_type_id:
          type: integer
          description: ID de la forma de pago en Siigo.
        payment_days:
          type: integer
          default: 15
      required:
      - document_id
      - payment_type_id
      - seller_id
    InvoiceConfirmResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        external_invoice_id:
          type: string
        external_number:
          type: string
      required:
      - external_invoice_id
      - external_number
      - status
    InvoicePreview:
      type: object
      properties:
        remittance_id:
          type: string
          format: uuid
        remittance_number:
          type: string
          nullable: true
        customer:
          $ref: '#/components/schemas/InvoicePreviewCustomer'
        payment_method:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePreviewItem'
        payment_days:
          type: integer
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        external_writes_enabled:
          type: boolean
      required:
      - customer
      - external_writes_enabled
      - items
      - payment_days
      - payment_method
      - remittance_id
      - remittance_number
      - subtotal
    InvoicePreviewCustomer:
      type: object
      properties:
        siigo_id:
          type: string
        nit:
          type: string
        name:
          type: string
      required:
      - name
      - nit
      - siigo_id
    InvoicePreviewItem:
      type: object
      properties:
        line_number:
          type: integer
        sku:
          type: string
        description:
          type: string
        quantity:
